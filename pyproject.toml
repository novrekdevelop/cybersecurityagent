[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberaudit-pro"
version = "2.0.0"
description = "Professional web security auditing and analysis framework (authorized use only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "audit", "web", "owasp", "pentest"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
cyberaudit = "cyberaudit.cli:main"

[tool.setuptools.packages.find]
include = ["cyberaudit", "cyberaudit.*"]